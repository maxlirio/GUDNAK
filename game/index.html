<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUDNAK — the table</title>
<link rel="stylesheet" href="css/game.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud"></div>

<div id="lobby"></div>

<div id="sound" hidden>
  <button id="sound-mute" type="button" title="Music on/off" aria-label="Music on/off">♪</button>
  <input id="sound-vol" type="range" min="0" max="100" step="1" aria-label="Music volume">
</div>

<div id="boot">
  <div class="bootcard">
    <h1>GUDNAK</h1>
    <p id="boot-msg">Raising the battlefield…</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
